[project]
name = "demeter-engine"
version = "0.1.0"
description = "Local mountain orchard hydraulic design workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "shapely>=2.1", "numpy>=2.0", "scipy>=1.14", "wntr>=1.3", "networkx>=3.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
